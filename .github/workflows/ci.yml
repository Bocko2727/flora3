name: CI

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Фиктивни публични стойности само за check/build; не са secrets.
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      FLORA_OFFLINE_EXTERNAL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  # Фаза B: локален Supabase в Docker на runner-а. Тестовите helpers отказват
  # всичко, което не е 127.0.0.1/localhost, така че хостът не се докосва.
  db-e2e:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLORA_OFFLINE_EXTERNAL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:start
      # Записва .env само с ключовете на локалния stack; не се отпечатва.
      - run: npm run env:local
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Директно CLI (MIT), без gitleaks-action — той иска лиценз за организации.
      - name: gitleaks (само диапазонът на PR-а)
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ -n "$BASE_SHA" ]; then RANGE="--log-opts=${BASE_SHA}..${HEAD_SHA}"; else RANGE=""; fi
          ./gitleaks git --redact --no-banner --verbose $RANGE .
